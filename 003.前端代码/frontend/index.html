<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FF7A00" />
    <title>智程 · AI 跑步教练</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full bg-surface text-on-surface font-body antialiased">
    <div id="app" class="h-full"></div>
    <script>
      // 直接点击源码入口或使用 Live Server 时，自动打开已构建的静态版本。
      const currentPath = window.location.pathname.replace(/\\/g, '/')
      const isSourceEntry = !currentPath.includes('/dist/') && currentPath.endsWith('/index.html')
      const isViteDevServer = window.location.port === '5173'
      if (isSourceEntry && (window.location.protocol === 'file:' || !isViteDevServer)) {
        window.location.replace('./dist/index.html')
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
